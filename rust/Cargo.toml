[package]
name = "althub_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.ndk]
platform = 26
targets = ["armeabi-v7a", "arm64-v8a"]
