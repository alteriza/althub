name: Build and Release AltHub APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-althub-${{ hashFiles('**/Cargo.toml', '**/*.gradle.kts') }}

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

      - name: Prepare App Icon Resources
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable/ic_althub_logo.png
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Configure APK Signing
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PATH="$RUNNER_TEMP/althub-release.jks"
          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            ALIAS_NAME="${SECRET_KEY_ALIAS:-althub}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KS_PASS}"
            SIGN_SOURCE="EXISTING_SECRET"
            NEW_KS_B64=""
          else
            KS_PASS="$(openssl rand -hex 16)"
            ALIAS_NAME="althub"
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=AltHub, OU=Alteriza, O=AltHub, L=Semarang, ST=CentralJava, C=ID"
            SIGN_SOURCE="AUTO_GENERATED"
            NEW_KS_B64="$(base64 -w 0 "$KS_PATH")"
          fi

          CERT_INFO="$(keytool -list -v -keystore "$KS_PATH" -alias "$ALIAS_NAME" -storepass "$KS_PASS" | grep -E 'SHA1:|SHA256:|Valid from:' || true)"

          echo "KEYSTORE_FILE=$KS_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          {
            echo "## AltHub Signing Summary"
            echo ""
            echo "- **Signing Mode:** \`$SIGN_SOURCE\`"
            echo "- **Key Alias:** \`$ALIAS_NAME\`"
            echo ""
            echo "### Certificate Fingerprints"
            echo "\`\`\`text"
            echo "$CERT_INFO"
            echo "\`\`\`"
            if [ "$SIGN_SOURCE" = "AUTO_GENERATED" ]; then
              echo ""
              echo "### Generated Signing Credentials (Save to Repository Secrets)"
              echo "- **KEYSTORE_PASSWORD:** \`$KS_PASS\`"
              echo "- **KEY_ALIAS:** \`$ALIAS_NAME\`"
              echo "- **KEY_PASSWORD:** \`$KEY_PASS\`"
              echo ""
              echo "**KEYSTORE_BASE64:**"
              echo "\`\`\`text"
              echo "$NEW_KS_B64"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename Release APK
        run: |
          SRC_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Release APK not found"
            exit 1
          fi
          mkdir -p dist
          cp "$SRC_APK" "dist/AltHub-v1.0.${BUILD_NUMBER}-release.apk"

      - name: Upload Direct GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          name: AltHub v1.0.${{ env.BUILD_NUMBER }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/AltHub-v1.0.${{ env.BUILD_NUMBER }}-release.apk