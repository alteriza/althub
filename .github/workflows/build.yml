name: Build & Release AltHub APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1A (PARALEL): Generate Mipmap (Legacy + Adaptive) & Logo dari icon.png
  # =========================================================================
  generate-icons:
    name: Generate Mipmap Icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Mipmap & Adaptive Icons from icon.png
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages Pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          if not os.path.exists("icon.png"):
              raise FileNotFoundError("icon.png tidak ditemukan di root repository!")

          src = Image.open("icon.png").convert("RGBA")

          # 1. Logo internal aplikasi (drawable/ic_althub_logo.png)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          logo = src.copy()
          logo.thumbnail((512, 512), Image.Resampling.LANCZOS)
          logo.save("app/src/main/res/drawable/ic_althub_logo.png")

          # 2. Legacy & Round Mipmap (Android 7 ke bawah & fallback)
          legacy_densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          # 3. Adaptive Icon Foreground (108dp canvas dengan safe-zone 68%)
          adaptive_densities = {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }

          for folder, size in legacy_densities.items():
              out_dir = f"app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)

              resized = src.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(f"{out_dir}/ic_launcher.png")

              mask = Image.new("L", (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size - 1, size - 1), fill=255)
              round_img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask=mask)
              round_img.save(f"{out_dir}/ic_launcher_round.png")

              fg_size = adaptive_densities[folder]
              safe_size = int(fg_size * 0.68)
              fg_canvas = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              fg_icon = src.resize((safe_size, safe_size), Image.Resampling.LANCZOS)
              offset = (fg_size - safe_size) // 2
              fg_canvas.paste(fg_icon, (offset, offset), mask=fg_icon)
              fg_canvas.save(f"{out_dir}/ic_launcher_foreground.png")

          # 4. Adaptive Icon XML (Android 8.0+ / API 26+)
          anydpi_dir = "app/src/main/res/mipmap-anydpi-v26"
          os.makedirs(anydpi_dir, exist_ok=True)

          bg_xml = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0D0D0D" />
          </shape>
          """
          with open("app/src/main/res/drawable/ic_launcher_background.xml", "w") as f:
              f.write(bg_xml.strip() + "\n")

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          """
          for xml_name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"{anydpi_dir}/{xml_name}", "w") as f:
                  f.write(adaptive_xml.strip() + "\n")
          EOF

      - name: Cache Generated Icons for Next Job
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/res/drawable/ic_althub_logo.png
            app/src/main/res/drawable/ic_launcher_background.xml
            app/src/main/res/mipmap-*
          key: althub-icons-${{ github.run_id }}-${{ github.run_attempt }}

  # =========================================================================
  # STAGE 1B (PARALEL MATRIX): Compile Rust Native Core (ARMv7 & ARMv8)
  # =========================================================================
  build-rust:
    name: Build Rust (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Rust Directory & Crate Name
        id: rust_meta
        run: |
          if [ -f "rust/Cargo.toml" ]; then
            CARGO_DIR="rust"
          elif [ -f "app/src/main/rust/Cargo.toml" ]; then
            CARGO_DIR="app/src/main/rust"
          else
            CARGO_DIR="."
          fi
          CRATE_NAME=$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$CARGO_DIR/Cargo.toml" | head -n1 | tr '-' '_')
          SO_NAME="lib${CRATE_NAME:-althub_core}.so"
          echo "cargo_dir=$CARGO_DIR" >> "$GITHUB_OUTPUT"
          echo "so_name=$SO_NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure Android NDK Available
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
            NDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Rust (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Prebuilt cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Cargo Dependencies & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ steps.rust_meta.outputs.cargo_dir }}/target/
          key: cargo-${{ matrix.abi }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.abi }}-

      - name: Compile ${{ steps.rust_meta.outputs.so_name }} (${{ matrix.abi }})
        working-directory: ${{ steps.rust_meta.outputs.cargo_dir }}
        run: |
          OUT_JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          mkdir -p "$OUT_JNI"
          cargo ndk \
            -t ${{ matrix.abi }} \
            --platform 26 \
            -o "$OUT_JNI" \
            build --release

      - name: Cache Compiled .so for Next Job
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/${{ matrix.abi }}/*.so
          key: althub-jni-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}

  # =========================================================================
  # STAGE 2 (SEQUENCE AKHIR): Assemble APK, Sign & Upload ke GitHub Release
  # =========================================================================
  build-sign-release:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest
    needs: [generate-icons, build-rust]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Generated Icons
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/res/drawable/ic_althub_logo.png
            app/src/main/res/drawable/ic_launcher_background.xml
            app/src/main/res/mipmap-*
          key: althub-icons-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Restore Compiled Rust ARM64
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/*.so
          key: althub-jni-arm64-v8a-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Restore Compiled Rust ARMv7
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/armeabi-v7a/*.so
          key: althub-jni-armeabi-v7a-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          if grep -rq "cargoBuild" app/build.gradle* build.gradle* 2>/dev/null; then
            $GRADLE_CMD assembleRelease -x cargoBuild --no-daemon
          else
            $GRADLE_CMD assembleRelease --no-daemon
          fi

      # ---------------------------------------------------------------------
      # SIGNING KEY: Pakai GitHub Secrets jika ada, atau auto-generate baru
      # ---------------------------------------------------------------------
      - name: Prepare Signing Keystore
        env:
          SECRET_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SECRET_B64" ]; then
            GEN_ALIAS="althub"
            GEN_PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias "$GEN_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$GEN_PASS" \
              -keypass "$GEN_PASS" \
              -dname "CN=AltHub, OU=Alteriza, O=AltHub, L=Semarang, ST=Central Java, C=ID"

            KEY_B64=$(base64 -w 0 release-keystore.jks)
            {
              echo "KEY_MODE=AUTO"
              echo "ACTIVE_KEY_ALIAS=$GEN_ALIAS"
              echo "ACTIVE_STORE_PASS=$GEN_PASS"
              echo "ACTIVE_KEY_PASS=$GEN_PASS"
              echo "ACTIVE_KEYSTORE_B64<<EOF"
              echo "$KEY_B64"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            if [ -z "$SECRET_STORE_PASS" ]; then
              echo "ERROR: SIGNING_KEYSTORE_BASE64 diisi, tetapi SIGNING_STORE_PASSWORD kosong!"
              exit 1
            fi
            printf '%s' "$SECRET_B64" | tr -d '\r\n ' | base64 -d > release-keystore.jks
            RESOLVED_ALIAS="${SECRET_ALIAS:-althub}"
            RESOLVED_STORE_PASS="$SECRET_STORE_PASS"
            RESOLVED_KEY_PASS="${SECRET_KEY_PASS:-$RESOLVED_STORE_PASS}"

            {
              echo "KEY_MODE=SECRET"
              echo "ACTIVE_KEY_ALIAS=$RESOLVED_ALIAS"
              echo "ACTIVE_STORE_PASS=$RESOLVED_STORE_PASS"
              echo "ACTIVE_KEY_PASS=$RESOLVED_KEY_PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Zipalign, Sign & Verify APK
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: APK release tidak ditemukan!"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n1)
          if [ -z "$BUILD_TOOLS" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
            BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          fi

          VERSION_NAME=$("$BUILD_TOOLS/aapt2" dump badging "$RAW_APK" 2>/dev/null | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          VERSION_NAME=$(printf '%s' "${VERSION_NAME:-1.0.${GITHUB_RUN_NUMBER}}" | tr -cd '0-9A-Za-z._-')
          SIGNED_APK="AltHub-v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias "$ACTIVE_KEY_ALIAS" \
            --ks-pass "pass:$ACTIVE_STORE_PASS" \
            --key-pass "pass:$ACTIVE_KEY_PASS" \
            --out "$SIGNED_APK" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          APK_SHA256=$(sha256sum "$SIGNED_APK" | awk '{print $1}')

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "SIGNED_APK=$SIGNED_APK"
            echo "APK_SHA256=$APK_SHA256"
          } >> "$GITHUB_ENV"

      - name: Write Signing Info to Job Summary
        if: always() && env.SIGNED_APK != ''
        run: |
          CERT_INFO=$(keytool -list -v -keystore release-keystore.jks -alias "$ACTIVE_KEY_ALIAS" -storepass "$ACTIVE_STORE_PASS" 2>/dev/null | grep -E "SHA1:|SHA256:|Valid from:" || true)
          {
            echo "## 🔐 AltHub APK Build & Signing Summary"
            echo ""
            echo "- **APK Output:** \`$SIGNED_APK\`"
            echo "- **APK SHA-256:** \`$APK_SHA256\`"
            echo "- **Sumber Keystore:** \`$KEY_MODE\`"
            echo ""
            if [ "$KEY_MODE" = "AUTO" ]; then
              echo "> ⚠️ **Penting:** Keystore baru dibuat otomatis. Simpan nilai di bawah ke **Repository Secrets** agar update APK berikutnya kompatibel tanpa uninstall."
              echo ""
              echo "| Secret Name | Value |"
              echo "| :--- | :--- |"
              echo "| \`SIGNING_KEY_ALIAS\` | \`$ACTIVE_KEY_ALIAS\` |"
              echo "| \`SIGNING_STORE_PASSWORD\` | \`$ACTIVE_STORE_PASS\` |"
              echo "| \`SIGNING_KEY_PASSWORD\` | \`$ACTIVE_KEY_PASS\` |"
              echo ""
              echo "### \`SIGNING_KEYSTORE_BASE64\`"
              echo '```text'
              echo "$ACTIVE_KEYSTORE_B64"
              echo '```'
              echo ""
            fi
            echo "### Certificate Fingerprint"
            echo '```text'
            echo "$CERT_INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Signed APK Directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$SIGNED_APK" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$SIGNED_APK" \
              --title "AltHub v${VERSION_NAME} (Build #${GITHUB_RUN_NUMBER})" \
              --notes "$(printf 'Build otomatis dari commit `%s` (ARMv7 & ARMv8).\n\n- **File:** `%s`\n- **SHA-256:** `%s`' "${GITHUB_SHA::7}" "$SIGNED_APK" "$APK_SHA256")" \
              --latest
          fi