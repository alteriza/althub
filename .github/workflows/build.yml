name: Build AltHub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
          
      - name: Setup Rust & Android Targets (ARMv7 & ARMv8)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Native Rust Library (libalthub_core.so)
        working-directory: rust
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -p 26 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltHub-Release
          path: app/build/outputs/apk/release/*.apk